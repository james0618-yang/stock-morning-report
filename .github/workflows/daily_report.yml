name: 每日指数早报

on:
  schedule:
    # GitHub Actions 的 cron 使用 UTC。
    # 北京时间 08:00 = UTC 00:00，故用 0 0 * * *
    - cron: "0 0 * * *"
  workflow_dispatch: {}   # 允许在 Actions 页面手动触发测试

permissions:
  contents: write        # 允许 workflow 把生成的 HTML commit 回仓库

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install --no-cache-dir requests

      - name: 生成早报
        run: python3 morning_report.py once

      - name: 提交并推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add morning_report.html
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "chore: 每日早报 $(date +'%Y-%m-%d')"
            git push
          fi
